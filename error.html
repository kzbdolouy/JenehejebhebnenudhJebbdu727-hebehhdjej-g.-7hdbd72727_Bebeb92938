<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Kobra - Wait">
    <title>Kobra</title>
    <link rel="icon" href="k.jpeg" type="image/jpeg">
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #ffffff;
            font-family: Arial, sans-serif;
        }

        .center-box {
            width: 90%;
            max-width: 350px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border: 2px solid #000;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
            text-align: center;
        }

        .center-box h1 {
            margin: 0;
            font-size: 2rem;
            font-weight: bold;
        }

        .center-box p {
            margin-top: 10px;
            font-size: 1rem;
            color: #555;
        }

        @media (max-width: 480px) {
            .center-box {
                padding: 15px;
            }

            .center-box h1 {
                font-size: 1.5rem;
            }

            .center-box p {
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>
    <div class="center-box">
        <h1>Kobra</h1>
        <p>Пожалуйста подождите, эта страница в разработке.</p>
    </div>
</body>
</html>
